<!doctype html>
<html lang="en" data-theme="dark" data-colour="violet">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Sportlight — the most intense live sports moments, side by side." />
    <meta name="theme-color" content="#F7F8F4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101210" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Sportlight</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var p = JSON.parse(localStorage.getItem('sportlight.prefs.v1') || '{}');
        var t = p.theme === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : (p.theme === 'light' ? 'light' : 'dark');
        document.documentElement.dataset.theme = t;
        document.documentElement.dataset.colour = ['lime', 'blue', 'red', 'yellow', 'orange', 'violet'].includes(p.colour) ? p.colour : 'violet';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
