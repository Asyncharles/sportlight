# Static media origin: byte ranges for seeking, long caching, CORS for packaged apps.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/media;

  types {
    video/mp4 mp4;
    image/jpeg jpg;
    application/json json;
    text/markdown md;
  }

  location / {
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  location = /catalog.json {
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "no-cache";
  }
}
