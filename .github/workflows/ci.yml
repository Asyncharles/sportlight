# Required check on main. No GCP access.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20        # match the Node version in the Dockerfiles
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Compose files parse (dummy values; nothing secret here)
        env:
          AMQP_URL: amqp://ci:ci@broker.invalid:5672/ci
          PUBLIC_HOST: ci.invalid
          IMAGE_SPORTLIGHT_MEDIA: ci/media:0
          IMAGE_SPORTLIGHT_BACKEND: ci/backend:0
          IMAGE_SPORTLIGHT_PUBLISHER: ci/publisher:0
          IMAGE_SPORTLIGHT_WEB: ci/web:0
        run: |
          docker compose -f docker-compose.yml -f docker-compose.external.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.external.yml -f deploy/compose.gcp.yml config --quiet
